<div class="register-bg-gradient"></div>
<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <img src="https://angular.io/assets/images/logos/angular/angular.svg" alt="Angular Logo" class="register-logo animated-logo">
      <h2>Register</h2>
    </div>
    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group floating-label-group">
        <input type="email" id="email" name="email" [(ngModel)]="email" required autocomplete="email" />
        <label for="email" [class.filled]="email">Email</label>
      </div>
      <div class="form-group floating-label-group">
        <input type="text" id="username" name="username" [(ngModel)]="username" required autocomplete="username" />
        <label for="username" [class.filled]="username">Username</label>
      </div>
      <div class="form-group floating-label-group password-group">
        <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required autocomplete="new-password" />
        <label for="password" [class.filled]="password">Password</label>
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <span *ngIf="showPassword">🙈</span>
          <span *ngIf="!showPassword">👁️</span>
        </button>
      </div>
      <div class="form-group floating-label-group">
        <select id="role" name="role" [(ngModel)]="role" required>
          <option value="" disabled selected hidden></option>
          <option value="USER">User</option>
          <option value="ADMIN">Admin</option>
        </select>
        <label for="role" [class.filled]="role">Role</label>
      </div>
      <button type="submit" class="register-btn" [disabled]="loading">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    </form>
    <div class="login-link">
      <span>Already have an account?</span>
      <a (click)="goToLogin()">Login</a>
    </div>
  </div>
</div>
