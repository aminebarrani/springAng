<div class="login-bg-gradient"></div>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="https://angular.io/assets/images/logos/angular/angular.svg" alt="Angular Logo" class="login-logo animated-logo">
      <h2>Sign In</h2>
    </div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group floating-label-group">
        <input type="text" id="username" name="username" [(ngModel)]="username" required autocomplete="username" />
        <label for="username" [class.filled]="username">Username</label>
      </div>
      <div class="form-group floating-label-group password-group">
        <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
        <label for="password" [class.filled]="password">Password</label>
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <span *ngIf="showPassword">🙈</span>
          <span *ngIf="!showPassword">👁️</span>
        </button>
      </div>
      <button type="submit" class="login-btn" [disabled]="loading">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>
    <div class="register-link">
      <span>Don't have an account?</span>
      <a (click)="goToRegister()">Register</a>
    </div>
  </div>
</div>
